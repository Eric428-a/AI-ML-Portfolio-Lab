services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: multi-document-rag-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - rag_uploads:/app/app/storage/uploads
      - rag_vectors:/app/app/storage/vector_db
      - rag_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: multi-document-rag-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rag_uploads:
  rag_vectors:
  rag_data: