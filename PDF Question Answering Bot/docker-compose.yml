# docker-compose.yml
services:
  pdf-question-answering-bot:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: pdf-question-answering-bot

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      APP_ENV: development
      DEBUG: "true"
      HOST: 0.0.0.0
      PORT: 8000

    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/processed:/app/data/processed
      - ./data/chroma:/app/data/chroma
      - ./models:/app/models

    restart: unless-stopped